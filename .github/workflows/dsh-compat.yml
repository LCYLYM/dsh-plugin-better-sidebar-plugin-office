name: DSH compatibility guardian

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  guardian:
    uses: LCYLYM/dsh-plugin-compat-guardian/.github/workflows/guardian.yml@3de35600566ad1f4ff318e2de3d99de48b6ec72a
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: LCYLYM/dsh-plugin-compat-guardian
      guardian_ref: 3de35600566ad1f4ff318e2de3d99de48b6ec72a
      runner: ubuntu-24.04
      target_dsh: 0.1.1-rc.2
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
